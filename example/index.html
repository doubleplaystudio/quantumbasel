<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>test</title>
<style>
body{margin:0;background:#04060b;color:#eef4f6;font-family:system-ui}
.main-content{position:relative;z-index:1}
.hero{height:100vh}
.hero-chrome{position:fixed;inset:0;z-index:2}
.hero-label{position:absolute;top:50%;transform:translateY(-50%);font-size:60px;margin:0}
.is-left{left:9vw}.is-right{right:9vw}
.replay{position:absolute;right:20px;bottom:20px;width:38px;height:38px;border-radius:50%}
.hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);font-size:12px}
.sec{min-height:120vh;display:grid;place-items:center;font-size:40px}
</style></head>
<body class="global-body">
<nav class="nav" data-logo-particles="intro-hide" style="position:fixed;top:0;left:0;right:0;z-index:3;padding:20px;display:flex;justify-content:space-between"><b>QuantumBasel</b><span>Menu</span></nav>
<div class="hero-chrome" data-logo-particles="chrome">
  <p class="hero-label is-left" data-logo-particles="split">Quantum</p>
  <p class="hero-label is-right" data-logo-particles="split">Basel</p>
  <div class="hint" data-logo-particles="hint">Ziehen zum Drehen · Scrollen</div>
  <button class="replay" data-logo-particles="replay" aria-label="Replay">↺</button>
</div>
<main class="main-content">
  <section class="hero" data-logo-particles="hero" data-lp-viscosity="1"></section>
  <section class="sec">Headline</section><section class="sec">Content</section>
</main>
<script src="../logo-particles/quantumbasel.data.js"></script>
<script type="module" src="../logo-particles/logo-particles.js"></script>
</body></html>
